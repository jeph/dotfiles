onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[keys]
prefix = "ctrl+space"
previous_tab = ["prefix+p", "alt+shift+h"]
next_tab = ["prefix+n", "alt+shift+l"]
split_vertical = ["prefix+v", "prefix+percent"]
split_horizontal = ["prefix+minus", "prefix+double_quote"]
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[ui]
mouse_capture = true
copy_on_select = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = false

# Display terminal title in agents sidebar
[ui.sidebar.agents]
rows = [["state_icon", { token = "terminal_title_stripped", fg = "#89dceb", bold = true }], ["agent", "tab"]]
